[project]
name = "spatial-copilot"
version = "0.1.0"
description = "Spatial analysis demo with validated tool calls and GeoJSON output"
authors = [{ name = "Zhang Kuo" }]
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "shapely>=2.0.0",
    "httpx>=0.27.0",
    "pyproj>=3.6.0",
    "uvicorn>=0.28.0"
]
requires-python = ">=3.10"

[tool.setuptools.package-data]
api = ["*.html", "*.mjs", "vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
